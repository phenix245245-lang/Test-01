<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour toi mon amour ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 30%),
                radial-gradient(circle at 80% 15%, #ffd9e7 0%, transparent 35%),
                radial-gradient(circle at 50% 100%, #ffe6ef 0%, transparent 45%),
                linear-gradient(135deg, #fffafd, #ffeaf2, #fff4f8);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fond animé */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            opacity: .45;
            animation: float 9s infinite alternate ease-in-out;
        }

        .orb1 {
            width: 280px;
            height: 280px;
            background: #ffc1d9;
            top: -100px;
            left: -80px;
        }

        .orb2 {
            width: 320px;
            height: 320px;
            background: #ffd5e5;
            right: -100px;
            bottom: -120px;
            animation-delay: 2s;
        }

        .orb3 {
            width: 170px;
            height: 170px;
            background: #f8c8dc;
            left: 45%;
            top: 45%;
            animation-delay: 4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(45px, -30px) scale(1.15);
            }
        }

        /* Petits cœurs */
        .heart {
            position: absolute;
            bottom: -50px;
            color: #e889aa;
            opacity: 0;
            animation: rise linear forwards;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg) scale(.6);
                opacity: 0;
            }

            15% {
                opacity: .65;
            }

            100% {
                transform: translateY(-115vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Contenu principal */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px;

            animation: appear 2s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .little {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #b97891;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 9vw, 90px);
            font-weight: normal;
            font-style: italic;
            color: #b94f76;

            text-shadow:
                0 5px 20px rgba(185, 79, 118, .15);

            animation: softGlow 3s infinite ease-in-out;
        }

        @keyframes softGlow {
            0%, 100% {
                text-shadow: 0 5px 20px rgba(185, 79, 118, .12);
            }

            50% {
                text-shadow: 0 5px 30px rgba(224, 103, 145, .35);
            }
        }

        /* Gros cœur */
        .main-heart {
            width: 55px;
            height: 55px;
            background: #ed789e;

            position: relative;
            margin: 45px auto 0;

            transform: rotate(-45deg);
            animation: beat 1.5s infinite;

            box-shadow:
                0 10px 30px rgba(218, 91, 132, .25);
        }

        .main-heart::before,
        .main-heart::after {
            content: "";
            position: absolute;

            width: 55px;
            height: 55px;

            border-radius: 50%;
            background: #ed789e;
        }

        .main-heart::before {
            top: -27px;
            left: 0;
        }

        .main-heart::after {
            top: 0;
            left: 27px;
        }

        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }

            20% {
                transform: rotate(-45deg) scale(1.15);
            }

            40% {
                transform: rotate(-45deg) scale(1);
            }

            60% {
                transform: rotate(-45deg) scale(1.08);
            }
        }

        /* Petites décorations */
        .flower {
            position: absolute;
            font-size: 22px;
            opacity: .6;
            animation: rotateFlower 5s infinite ease-in-out;
        }

        .flower1 {
            left: 12%;
            top: 25%;
        }

        .flower2 {
            right: 12%;
            top: 30%;
            animation-delay: 1s;
        }

        .flower3 {
            left: 18%;
            bottom: 18%;
            animation-delay: 2s;
        }

        .flower4 {
            right: 18%;
            bottom: 15%;
            animation-delay: 3s;
        }

        @keyframes rotateFlower {
            0%, 100% {
                transform: rotate(-10deg) scale(1);
            }

            50% {
                transform: rotate(10deg) scale(1.15);
            }
        }

        @media (max-width: 600px) {

            .little {
                font-size: 9px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 46px;
            }

            .flower {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="background">

        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>

        <div class="flower flower1">🌸</div>
        <div class="flower flower2">🌷</div>
        <div class="flower flower3">🌸</div>
        <div class="flower flower4">🌷</div>

    </div>


    <div class="content">

        <div class="little">
            Avec tout mon cœur
        </div>

        <h1>
            Pour toi mon amour ❤️
        </h1>

        <div class="main-heart"></div>

    </div>


    <script>

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";

            const symbols = [
                "♥",
                "♡",
                "❤",
                "💕",
                "💗"
            ];

            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (12 + Math.random() * 22) + "px";

            heart.style.animationDuration =
                (6 + Math.random() * 7) + "s";

            document
                .querySelector(".background")
                .appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 14000);
        }

        setInterval(createHeart, 500);

        for (let i = 0; i < 12; i++) {
            setTimeout(createHeart, i * 250);
        }

    </script>

</body>
</html>
